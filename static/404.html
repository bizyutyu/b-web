<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません | lab</title>
</head>
<body>
  <!-- Firebase Hosting が rewrites に一致しないパスに HTTP 404 で返す静的ページ。
       見た目は src/Pages/NotFound_.elm と揃えること。 -->

    <h1>404</h1>
    <p>お探しのページは見つかりませんでした。</p>
    <a href="/">← トップに戻る</a>
  </main>
</body>
</html>
